; PlatformIO project configuration for developing Seeed Arduino mmWave.
;
; [env:native] host-side unit tests for FrameCodec / FrameAssembler.

[platformio]
default_envs = native

[env:native]
platform         = native
test_framework   = unity
test_build_src   = yes
build_src_filter = -<*> +<FrameCodec.cpp> +<FrameAssembler.cpp>
build_flags      =
    -std=gnu++17
    -Isrc
