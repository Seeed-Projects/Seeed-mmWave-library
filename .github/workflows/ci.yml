name: CI

on:
  push:
    branches: [main, 'release/**', v2-dev]
  pull_request:
    branches: [main, 'release/**', v2-dev]

jobs:
  host-tests:
    name: Host unit tests (FrameCodec)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio
      - name: Run native tests
        run: pio test -e native

  arduino-lint:
    name: arduino-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/arduino-lint-action@v2
        with:
          compliance: specification
          library-manager: submit
          project-type: library

  compile-examples:
    name: Compile examples on XIAO ESP32-C6
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/compile-sketches@v1
        with:
          fqbn: esp32:esp32:XIAO_ESP32C6
          platforms: |
            - name: esp32:esp32
              source-url: https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          libraries: |
            - source-path: ./
            - name: Adafruit NeoPixel
            - name: hp_BH1750
            - name: U8g2
          sketch-paths: |
            - examples/mmwaveBreath
            - examples/PeopleCounting_demo
            - examples/ReadByte
            - examples/passthrough_mode
            - examples/ReadLuxValue
            - examples/LightRGB
            - examples/Grove_U8x8
            - examples/breath_demo
            - examples/fall_demo
          cli-compile-flags: |
            - --warnings=default
